name: Publish to npmjs

# Releases are cut by pushing a tag: `git tag v2.7.1 && git push origin v2.7.1`.
# Pushes to branches do nothing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # The tag is the release; package.json must agree with it, otherwise the
      # tarball would publish under a version the tag does not name.
      - name: Check tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # The package ships TypeScript source only; there is no build step, so
      # no dependency install is needed to publish.
      #
      # A plain vX.Y.Z publishes as `latest`; a prerelease (vX.Y.Z-rc.1, any
      # version containing a hyphen) publishes under `next` so hosts pinned to
      # @latest are not upgraded by it.
      - name: Resolve dist-tag
        run: |
          TAG=latest
          case "${GITHUB_REF_NAME}" in *-*) TAG=next ;; esac
          echo "DIST_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "publishing ${GITHUB_REF_NAME} as dist-tag ${TAG}"

      # A version that already exists on the registry is skipped, not failed —
      # re-pushing a tag must not break the workflow.
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on npmjs — skipping publish"
            exit 0
          fi
          npm publish --access public --tag "${DIST_TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
